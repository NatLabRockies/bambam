[package]
name = "bambam-gtfs"
version.workspace = true
edition = "2021"
license = "BSD-3-Clause"
exclude = ["test", "**/.DS_Store", "target/"]
readme = "README.md"
repository = "https://github.com/NatLabRockies/bambam"
documentation = "https://docs.rs/bambam-gtfs"
description = "GTFS Schedule and GTFS-Flex data structures and reader for BAMBAM"
keywords = ["nlr", "access-model", "accessibility", "gtfs", "transit"]
categories = ["science", "science::geo"]

[features]
default = ["gtfs-flex"]
gtfs-flex = ["dep:geojson"]

[dependencies]
chrono = { workspace = true }
chrono-tz = { workspace = true }
csv = { workspace = true }
derive_more = { workspace = true }
flate2 = { workspace = true }
geojson = { workspace = true, optional = true }
rgb = { workspace = true }
rkyv = { workspace = true }
rstar = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uom = { workspace = true }
zip = { workspace = true }
