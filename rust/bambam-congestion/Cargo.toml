[package]
name = "bambam-congestion"
version.workspace = true
edition = "2021"
license = "BSD-3-Clause"
exclude = ["test", "**/.DS_Store", "target/"]
readme = "README.md"
repository = "https://github.com/NatLabRockies/bambam"
documentation = "https://docs.rs/bambam-congestion"
description = "Congestion calibration and operating speed imputation for BAMBAM and RouteE Compass road networks"
keywords = ["nlr", "access-model", "congestion", "routing", "network"]
categories = ["command-line-utilities", "science", "science::geo"]

