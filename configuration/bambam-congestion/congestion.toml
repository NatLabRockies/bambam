# Unified BAMBAM Congestion Calibration & Speed Imputation Configuration (`congestion.toml`)
#
# Matches `bambam_congestion::CongestionPipelineConfig`.
# Defines shared model, time-bin, spatial feature, and conflation parameters across the pipeline.
# Dataset and filesystem paths are passed via CLI flags in workflow scripts:
#   1. `bambam-congestion calibrate --config configuration/bambam-congestion/congestion.toml --open-network-dir ...`
#   2. `uv run python python/nlr/bambam/congestion/train_congestion_models.py --calibration-dir ... --output-dir ...`
#   3. `bambam-congestion impute --config configuration/bambam-congestion/congestion.toml --open-network-dir ...`

[open_network]
mode = "drive"
legacy_posted_speed_unit = "kph"
min_imputed_speed_limit_mph = 15.0

# Explicit list of time-of-day bins (`TimeBinSpec`).
# Can be inspected programmatically via `bambam-congestion list-time-bins --config ...`
# or in Python via `bambam_py_api.get_congestion_time_bins("...")`.
[[time_bins]]
name = "wd-am"
weekday = "Wednesday"
start = "08:00:00"
end = "09:00:00"

[[time_bins]]
name = "wd-af"
weekday = "Wednesday"
start = "10:00:00"
end = "11:00:00"

[[time_bins]]
name = "wd-pm"
weekday = "Wednesday"
start = "17:00:00"
end = "18:00:00"

[[time_bins]]
name = "we-am"
weekday = "Sunday"
start = "08:00:00"
end = "09:00:00"

[[time_bins]]
name = "we-af"
weekday = "Sunday"
start = "10:00:00"
end = "11:00:00"

[[time_bins]]
name = "we-pm"
weekday = "Sunday"
start = "17:00:00"
end = "18:00:00"

[spatial_features]
density_radius_miles = 0.5
projection_mode = "geodesic"

# Opportunities source defaults to Overture Maps (`places` + `buildings`) over the network's bounding box.
# Can be overridden on the CLI via `--osm-pbf-path <path>` or `--omf-local-source-dir <dir>`.
# Census polygons can be supplied on the CLI via `--census-csv <path>` (exported by `bambam-congestion export-census`).
# Traffic controls default automatically to `<open_network.network_dir>/vertices-complete.csv.gz`.
[spatial_features.opportunities_source]
type = "overture_maps"
include_buildings = true

[reference_network]
speed_unit = "kph"
require_time_varying_speeds = true
file_prefix = "tomtom-natl"
file_extension = "txt.gz"

[conflation]
buffer_distance_meters = 5.0
max_heading_diff_degrees = 45.0
min_overlap_meters = 1.0
cap_speed_outliers = true
speed_cap_above_posted_mph = 10.0
speed_cap_above_class_max_mph = 5.0

[artifacts]
write_parquet = true
write_csv = true

